       только после разбора HTML и выполнения JS до строки с fetch() в map.js;

<script>
  // Telegram прячет свою заглушку только после ready() — зовём сразу, чтобы
  // игрок увидел заставку, а не пустой экран до конца загрузки модулей
  // (expand/полноэкранный режим — как раньше, в js/main.js).
  try { window.Telegram && Telegram.WebApp && Telegram.WebApp.ready(); } catch (e) {}
  // Страховка: карта так и не сообщила о готовности (сбой сети и т.п.).
  setTimeout(function () { var s = document.getElementById('splash'); if (s) s.remove(); }, 20000);
</script>

<div class="svg-widget" id="svgWidget">
  <!-- Панель карты (v=168, была колонкой кнопок в правом верхнем углу —
       246×176 px на телефоне, а в полноэкранном режиме Telegram туда же встают
       его кнопки «✕» и «⌄ ⋮»). Теперь — плавающая панель внизу, как нижняя
       панель Telegram: по бокам переходы (Феном — маркером, это точка;
       Справочник), в середине переключатель режима, над правым краем —
       круглые инструменты. Жест с любой кнопки двигает карту (#controls в
       js/map.js), поэтому id и роль контейнера прежние. -->
  <div class="top-scrim" aria-hidden="true"></div>
  <div class="map-dock" id="controls">
    <div class="dock-tools">
      <button id="helpBtn" class="dock-round" title="Как пользоваться картой" aria-label="Как пользоваться картой">?</button>
      <!-- 🏷️ (карта/графика) и ▦ (ноды) сменяют друг друга — инструмент
           текущего режима, см. updateViewModeUi в js/map.js. -->
      <button id="labelsToggle" class="dock-round" title="Меньше подписей: только готовые системы (быстрее на слабых устройствах)" aria-label="Меньше подписей">
        <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 12.4V5.1c0-.7.6-1.3 1.3-1.3h7.3l8 8-8.6 8.6z"/><circle cx="8.3" cy="8.3" r="1.5"/></svg>
      </button>
      <button id="sortToggle" class="dock-round" title="Ноды по разделам" aria-label="Ноды по разделам" hidden>
        <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.8" height="6.8" rx="1.6"/><rect x="13.2" y="4" width="6.8" height="6.8" rx="1.6"/><rect x="4" y="13.2" width="6.8" height="6.8" rx="1.6"/><rect x="13.2" y="13.2" width="6.8" height="6.8" rx="1.6"/></svg>
      </button>
    </div>
    <div class="dock-bar">
      <!-- Значок — маркер Фенома (ставит map.js, когда готов граф; до этого 🚀). -->
      <button id="gotoPhenom" class="dock-side dock-item" title="Корабль-город Феном">
        <span class="dock-icon" aria-hidden="true">🚀</span><span class="dock-label">Феном</span>
      </button>
      <!-- Переключатель режима (как слои на обычных картах), setViewMode в
           js/map.js: «Ноды» — граф связей без карты, «Карта» — с политической
           раскраской StellarMaps, «Графика» — та же карта без неё. Подсветка
           активного — «линза» .view-lens, её двигает updateViewModeUi. -->
      <div class="dock-modes" id="viewSwitch" role="group" aria-label="Режим просмотра карты">
        <span class="view-lens" aria-hidden="true"></span>
        <button class="view-switch-btn dock-item" data-view="nodes" title="Граф связей: все точки и их связи, без самой карты">
          <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7.6l8-1.2M6.8 10.1l3.9 6.3M17.3 8.2l-4.1 8.1"/><circle cx="5.5" cy="8" r="2.5"/><circle cx="18.5" cy="6" r="2.5"/><circle cx="12" cy="18.5" r="2.5"/></svg>
          <span class="dock-label">Ноды</span>
        </button>
        <button class="view-switch-btn dock-item active" data-view="map" title="Карта галактики">
          <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>
          <span class="dock-label">Карта</span>
        </button>
        <button class="view-switch-btn dock-item" data-view="graphics" title="Карта без политической раскраски — только фон, гиперлейны и названия систем">
          <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a1.5 1.5 0 0 1 3 0 3 3 0 0 1-6 0 4.5 4.5 0 0 1 9 0 6 6 0 0 1-12 0"/><circle class="dock-svg-dot" cx="19.6" cy="5.4" r="1"/><circle class="dock-svg-dot" cx="4.6" cy="18.8" r="0.8"/></svg>
          <span class="dock-label">Графика</span>
        </button>
      </div>
      <!-- Один вход во все статьи: открывает «Описание галактики», дальше —
           вкладками #refToolbar внутри статьи. -->
      <button id="openHandbook" class="dock-side dock-item" data-ref="galaxy" title="Справочник">
        <span class="dock-icon dock-emoji" aria-hidden="true">📖</span><span class="dock-label">Справочник</span>
      </button>
    </div>
  </div>
  <div class="calib-panel" id="calibPanel"></div>
  <!-- Редактор (js/editor.js): кнопка списка «что можно править» — только в
       карте, открытой кнопкой из лички бота, — и подсказка, что свои
       сохранённые правки уже показаны, хотя у остальных ещё нет. -->
  <div class="editor-toast" id="editorToast" role="status" hidden></div>
  <button type="button" class="editor-fab" id="editorFab" hidden></button>
</div>

<!-- Единая панель перекрёстной навигации между статьями-справочниками (Феном/
     Расы/Магический лор/Технологии/Описание галактики). Сама по себе нигде не
     показывается (см. .ref-toolbar { display:none } ) — существует только чтобы
     её пристыковать в #modalCard через openIframeModal, как и .system-toolbar/
     .phenom-toolbar. Наполнение и клики — см. REF_ARTICLES в js/articles.js. -->
<div class="ref-toolbar lore-toolbar tabbar" id="refToolbar">
  <button class="toolbar-close-btn" id="refToolbarClose" aria-label="Закрыть">✕</button>
  <!-- Справочник — только статьи, ссылок на точки карты здесь нет (24.09.2026):
       связь статья↔точка идёт в одну сторону — кнопкой «Статья» в окне точки.
       Быстрый вход в точку Феном — кнопка в углу карты. Была двойная ячейка
       «Феном | Карта», её правая половина вела в саму точку. -->
  <button class="tabbar-btn" data-ref="phenom">
    <span class="tabbar-btn-icon" aria-hidden="true">📖</span><span class="tabbar-btn-label">Феном</span>
  </button>
  <button class="tabbar-btn" data-ref="races">
    <span class="tabbar-btn-icon" aria-hidden="true">🧬</span><span class="tabbar-btn-label">Расы</span>
  </button>
  <button class="tabbar-btn" data-ref="magic">
    <span class="tabbar-btn-icon" aria-hidden="true">🔮</span><span class="tabbar-btn-label">Магия</span>
  </button>
  <button class="tabbar-btn" data-ref="tech">
    <span class="tabbar-btn-icon" aria-hidden="true">🔧</span><span class="tabbar-btn-label">Техника</span>
  </button>
  <button class="tabbar-btn" data-ref="galaxy">
    <span class="tabbar-btn-icon" aria-hidden="true">🌌</span><span class="tabbar-btn-label">Галактика</span>
  </button>
</div>

<!-- Полоска «тапни, где стоит персонаж» — выбор места в редакторе (js/editor.js,
     pickOnMap/pickOnSubmap в js/map.js). Поверх и карты галактики, и окна локации. -->
<div class="pick-banner" id="pickBanner" hidden>
  <span id="pickBannerText"></span>
  <button type="button" id="pickBannerCancel">Отмена</button>
</div>

<!-- Модал для "инфо"-точек (фракции/регионы) -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Полноэкранный вид отдельной системы. Меню — тот же таб-бар, что и у
     #refToolbar (см. ниже): "Карта системы" — всегда активна, пока статья не
     открыта, переключение никогда не пересоздаёт саму карту (#systemContainer
     не трогается) — просто закрывает/открывает статью поверх.

     ⚠️ Без ↩ рядом с ✕ — сознательно (12.09.2026, по замечанию игрока): тут
     это буквально переключение между двумя равноправными вкладками в одном
     ряду ("Карта системы"/"Контролирующая раса"), а не "чтение статьи, из
     которой нужно куда-то выбираться" — вкладка сама по себе уже и есть
     самый явный и понятный "путь назад", отдельная стрелка тут только
     дублировала бы то, что видно и так. -->
<div class="system-overlay" id="systemOverlay">
  <!-- Плашка ВНИЗУ (v=179), как у окна точки (.node-dock): строка «Точки в
       системе» с раскрывающимися колонками и под ней панель. Панель при
       статье расы переезжает в модал и там стоит на том же месте капсулой. -->
  <div class="node-dock system-dock">
  <div class="node-links system-links" id="systemLinks" hidden></div>
  <div class="system-toolbar lore-toolbar tabbar">
    <button class="toolbar-close-btn" id="systemBack" aria-label="Закрыть">✕</button>
    <button class="tabbar-btn active" id="systemMapTab">
      <span class="tabbar-btn-icon" aria-hidden="true">🗺️</span><span class="tabbar-btn-label">Карта системы</span>
    </button>
    <button class="tabbar-btn" id="systemLore">
      <span class="tabbar-btn-icon" aria-hidden="true">👑</span><span class="tabbar-btn-label">Контролирующая раса</span>
    </button>
  </div>
  </div>
  <div id="systemContainer" style="position:absolute; inset:0; touch-action:none;"></div>
</div>

<!-- Окно-вкладыш "Корабль-город Феном" — открывается поверх карты галактики,
     сама карта карта остаётся видна (затемнена) по краям. Внутри — карта Феном
     (тайлы + OpenSeadragon, см. js/phenom.js). -->
<div class="phenom-overlay" id="phenomOverlay">
  <div class="phenom-card" id="phenomCard">
    <!-- Плашка окна — ВНИЗУ, как панель карты (v=178): сверху строка «где я и
         кто тут» со шторкой переходов (#phenomLinks, renderNodeLinks в
         js/node-window.js), под ней вкладки — панель ДЕЙСТВИЙ, тот же
         таб-бар, что у статей и вида системы (.tabbar, грабли №12). Состав
         фиксирован: ✕, описание, статья, игра, карта, правка; пустые кнопки
         прячутся (applyNodeToolbar). При прокрутке тела вкладки уезжают вниз,
         строка остаётся. -->
    <div class="node-dock">
      <div class="node-links" id="phenomLinks" hidden></div>
      <div class="phenom-toolbar lore-toolbar tabbar" id="phenomToolbar">
      <button class="toolbar-close-btn" id="phenomClose" aria-label="Закрыть">✕</button>
      <!-- Тело окна — две вкладки: «Описание» (базовая, подсвечена при
           открытии) и «Статья» (только если у точки есть ссылка на статью),
           applyNodeToolbar/showNodeBody в js/node-window.js. -->
      <button class="tabbar-btn active" id="phenomDescriptionTab">
        <span class="tabbar-btn-icon" aria-hidden="true">📄</span><span class="tabbar-btn-label">Описание</span>
      </button>
      <button class="tabbar-btn" id="phenomArticleTab" style="display:none">
        <span class="tabbar-btn-icon" aria-hidden="true">📖</span><span class="tabbar-btn-label">Статья</span>
      </button>
      <!-- «Игра» — состав ветки (v=177), только если в ней есть персонажи
           (renderGame в js/node-window.js). -->
      <button class="tabbar-btn" id="phenomGameTab" style="display:none">
        <span class="tabbar-btn-icon" aria-hidden="true">♟️</span><span class="tabbar-btn-label">Игра</span>
      </button>
      <!-- Своя карта точки (поле submap, сейчас у Фенома) — ВИД поверх
           тела окна: ✕ превращается в ↩ и возвращает к нему
           (openSubmapView в js/phenom.js). -->
      <button class="tabbar-btn" id="phenomMapTab" hidden>
        <span class="tabbar-btn-icon" aria-hidden="true">🗺️</span><span class="tabbar-btn-label">Карта</span>
      </button>
      <!-- Только владелец группы, карта из лички бота — showNodeEditor в js/editor.js. -->
      <button class="tabbar-btn" id="phenomEdit" hidden>
        <span class="tabbar-btn-icon" aria-hidden="true">✏️</span><span class="tabbar-btn-label">Правка</span>
      </button>
    </div>
    </div>
    <div class="phenom-content" id="phenomContent">
      <!-- Персонажи, привязанные прямо к самой карте Феном (submapX/submapY в
           characters.json) — кнопка слева сверху над картой открывает их
           список, тап по пункту наводит вид OpenSeadragon на маркер. Список
           наполняется из графа связей при каждом открытии окна, см.
           openSubmapNode в js/map.js и setSubmapCharacters в js/phenom.js —
           руками сюда ничего не добавляется. Кнопка прячется сама, если
           таких персонажей пока нет. -->
      <div class="phenom-char-nav" id="phenomCharNav" hidden>
        <button class="phenom-char-nav-btn" id="phenomCharNavBtn" title="Персонажи на карте Феном">👥</button>
        <div class="phenom-char-nav-list" id="phenomCharNavList" hidden></div>
      </div>
      <div class="phenom-viewer" id="phenomViewer"></div>
      <!-- Содержимое для локаций без карты ("submap.type": "info", см.
           markers.json/CLAUDE.md) — баннер(ы) + заголовок + сворачиваемое
           описание, тот же визуальный язык, что у окна сюжета (переиспользует
           .story-banner-img/.story-title/.story-accordion), только тут это не
           сюжет, а локация без тайловой карты внутри (напр. "Кольцо Авалона").
           Показывается ВМЕСТО #phenomViewer/#phenomCharNav, а не рядом — см.
           openSubmap в js/phenom.js. -->
      <div class="story-content phenom-info-content" id="phenomInfoContent" hidden></div>
    </div>
  </div>
</div>

<!-- Окно-вкладыш сюжетного маркера — тот же слой, что и "Феном" (карта под
     ним видна, затемнена по краям), но содержимое текстовое, а не карта на
     тайлах. Данные — из stories.json, см. js/stories.js. Меню переведено на
     общий .tabbar (как у статей/системы/Феном/персонажа, см. грабли №12) —
     раньше тут были широкие текстовые кнопки-пилюли (.story-action-btn),
     единственное место в проекте, которое ещё не было на общем стиле. -->
<div class="phenom-overlay story-overlay" id="storyOverlay">
  <div class="phenom-card" id="storyCard">
    <div class="node-dock">
      <div class="node-links" id="storyLinks" hidden></div>
      <div class="phenom-toolbar lore-toolbar tabbar" id="storyToolbar">
      <button class="toolbar-close-btn" id="storyClose" aria-label="Закрыть">✕</button>
      <!-- Родителя тут нет — он в строке плашки (#storyLinks). -->
      <!-- Тело окна — «Описание» и «Статья», как у нижнего слоя. -->
      <button class="tabbar-btn active" id="storyDescription">
        <span class="tabbar-btn-icon" aria-hidden="true">📄</span><span class="tabbar-btn-label">Описание</span>
      </button>
      <button class="tabbar-btn" id="storyArticle" style="display:none">
        <span class="tabbar-btn-icon" aria-hidden="true">📖</span><span class="tabbar-btn-label">Статья</span>
      </button>
      <button class="tabbar-btn" id="storyGame" style="display:none">
        <span class="tabbar-btn-icon" aria-hidden="true">♟️</span><span class="tabbar-btn-label">Игра</span>
      </button>
      <!-- Только владелец группы, карта из лички бота — showNodeEditor в js/editor.js. -->
      <button class="tabbar-btn" id="storyEdit" hidden>
        <span class="tabbar-btn-icon" aria-hidden="true">✏️</span><span class="tabbar-btn-label">Правка</span>
      </button>
    </div>
    </div>
    <div class="phenom-content story-content" id="storyContent"></div>
  </div>
</div>

<!-- Окно персонажа (24.09.2026) — третий слой ТОГО ЖЕ окна точки, что и два
     выше: панель действий, ряд переходов (↑ родитель, союзники), тело — анкета.
     Раньше это была статья в общем модале с пристыкованной шторкой; теперь
     модал остался только редактору, справочнику и статье расы. Слой свой, а
     не общий с сюжетом: персонаж открывается ПОВЕРХ окна своего сюжета
     (Феном → сюжет → персонаж). Логика — js/characters.js. -->
<div class="phenom-overlay story-overlay char-overlay" id="charOverlay">
  <div class="phenom-card" id="charCard">
    <div class="node-dock">
      <div class="node-links" id="charLinks" hidden></div>
      <div class="phenom-toolbar lore-toolbar tabbar" id="charToolbar">
      <button class="toolbar-close-btn" id="charToolbarClose" aria-label="Закрыть">✕</button>
      <!-- Базовая вкладка — тело окна: анкета. -->
      <button class="tabbar-btn active" id="charSheet">
        <span class="tabbar-btn-icon" aria-hidden="true">📋</span><span class="tabbar-btn-label">Анкета</span>
      </button>
      <!-- Только у своих персонажей в карте, открытой из лички бота — js/editor.js. -->
      <button class="tabbar-btn" id="charEdit" hidden>
        <span class="tabbar-btn-icon" aria-hidden="true">✏️</span><span class="tabbar-btn-label">Правка</span>
      </button>
      <button class="tabbar-btn" id="charNotes">
        <span class="tabbar-btn-icon" aria-hidden="true">📝</span><span class="tabbar-btn-label">Заметки</span>
      </button>
      <button class="tabbar-btn" id="charRolls">
        <span class="tabbar-btn-icon" aria-hidden="true">🎲</span><span class="tabbar-btn-label">Броски</span>
      </button>
    </div>
    </div>
    <div class="phenom-content story-content" id="charContent"></div>
  </div>
</div>

<!-- Мини-игра Flappy Phenome (кнопка 🕹️ в подсказке «?»). Пустой слой: его
     наполняет js/flappy.js, который грузится только по нажатию. Слой здесь, а
     не в модуле, — за ним следит navigation.js (Esc / «назад» закрывают игру). -->
<div class="flappy-overlay" id="flappyOverlay"></div>

<script type="module" src="js/main.js?v=197"></script>
</body>
</html>
