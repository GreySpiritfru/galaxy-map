<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Карта галактики — Феном</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Карта Феном — огромная растровая иллюстрация (21284x9902px), порезана офлайн
       на тайлы (Deep Zoom Image, см. phenom-tiles/) и рендерится через OpenSeadragon:
       грузятся только видимые тайлы нужного уровня приближения, а не вся картинка
       разом (та же проблема, что уже возникала с 4096px-текстурой в map.svg, только
       на порядок крупнее — тайлы решают её в принципе, а не переносом лимита). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/5.0.1/openseadragon.min.js"></script>
  <!-- Самый тяжёлый файл на странице (9+ МБ) — без preload браузер начинает
       качать его только после разбора HTML и выполнения JS до строки с fetch()
       в map.js; так эта загрузка стартует параллельно с остальным. -->
  <link rel="preload" href="map.svg" as="fetch" crossorigin />
  <link rel="stylesheet" href="css/styles.css?v=15" />
</head>
<body>

<div class="svg-widget" id="svgWidget">
  <div class="svg-controls" id="controls">
    <!-- Раньше тут стопкой висели 4 отдельные кнопки статей-справочников. Теперь
         одна 📖: она открывает "Описание галактики", а дальше по всем остальным
         статьям ходят пристыкованным таб-баром (#refToolbar) прямо внутри
         статьи — отдельные кнопки в углу карты для этого больше не нужны.
         🚀 стоит слева от неё и ведёт не в статью, а в само место — карту
         корабля-города (это навигация, а не справка, поэтому отдельной кнопкой). -->
    <div class="controls-row">
      <button id="helpBtn" class="tools-toggle" title="Как пользоваться картой">?</button>
      <button id="gotoPhenom" class="corner-btn" title="Корабль-город Феном">
        <span aria-hidden="true">🚀</span><span class="corner-btn-label">Феном</span>
      </button>
      <button id="openHandbook" class="corner-btn" data-ref="galaxy" title="Справочник">
        <span aria-hidden="true">📖</span><span class="corner-btn-label">Справочник</span>
      </button>
      <button id="toolsToggle" class="tools-toggle" aria-label="Инструменты карты" aria-expanded="false">⋯</button>
    </div>
    <div class="controls-tools" id="controlsTools">
      <button id="zoomIn" aria-label="Zoom in">＋</button>
      <button id="zoomOut" aria-label="Zoom out">－</button>
      <button id="reset" aria-label="Reset view">⟲</button>
      <button id="calibToggle" title="Режим калибровки координат">📍</button>
    </div>
  </div>
  <div class="calib-panel" id="calibPanel"></div>
  <div class="svg-hint">Перетаскивание — палец/мышь, масштаб — щипок/колёсико. Тапни по названию системы.</div>
</div>

<!-- Единая панель перекрёстной навигации между статьями-справочниками (Феном/
     Расы/Магический лор/Технологии/Описание галактики). Сама по себе нигде не
     показывается (см. .ref-toolbar { display:none } ) — существует только чтобы
     её пристыковать в #modalCard через openIframeModal, как и .system-toolbar/
     .phenom-toolbar. Наполнение и клики — см. REF_ARTICLES в js/articles.js. -->
<div class="ref-toolbar lore-toolbar tabbar" id="refToolbar">
  <button class="toolbar-close-btn" id="refToolbarClose" aria-label="Закрыть">✕</button>
  <!-- Феном занимает двойную ячейку и разделён надвое: левая половина —
       статья про него (как у остальных вкладок), правая — переход в само
       место, на карту корабля-города (закрывает статью, наводит камеру на
       маркер и открывает окно Феном, см. #refPhenomMap в js/map.js). -->
  <div class="tabbar-split">
    <button class="tabbar-btn" data-ref="phenom">
      <span class="tabbar-btn-icon" aria-hidden="true">📖</span><span class="tabbar-btn-label">Феном</span>
    </button>
    <button class="tabbar-btn" id="refPhenomMap" title="Перейти на карту Фенома">
      <span class="tabbar-btn-icon" aria-hidden="true">🚀</span><span class="tabbar-btn-label">Карта</span>
    </button>
  </div>
  <button class="tabbar-btn" data-ref="races">
    <span class="tabbar-btn-icon" aria-hidden="true">🧬</span><span class="tabbar-btn-label">Расы</span>
  </button>
  <button class="tabbar-btn" data-ref="magic">
    <span class="tabbar-btn-icon" aria-hidden="true">🔮</span><span class="tabbar-btn-label">Магия</span>
  </button>
  <button class="tabbar-btn" data-ref="tech">
    <span class="tabbar-btn-icon" aria-hidden="true">🔧</span><span class="tabbar-btn-label">Техника</span>
  </button>
  <button class="tabbar-btn" data-ref="galaxy">
    <span class="tabbar-btn-icon" aria-hidden="true">🌌</span><span class="tabbar-btn-label">Галактика</span>
  </button>
</div>

<!-- Модал для "инфо"-точек (фракции/регионы) -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Полноэкранный вид отдельной системы. Меню — тот же таб-бар, что и у
     #refToolbar (см. ниже): "Карта системы" — всегда активна, пока статья не
     открыта, переключение никогда не пересоздаёт саму карту (#systemContainer
     не трогается) — просто закрывает/открывает статью поверх. -->
<div class="system-overlay" id="systemOverlay">
  <div class="system-toolbar lore-toolbar tabbar">
    <button class="toolbar-close-btn" id="systemBack" aria-label="Закрыть">✕</button>
    <button class="tabbar-btn active" id="systemMapTab">
      <span class="tabbar-btn-icon" aria-hidden="true">🗺️</span><span class="tabbar-btn-label">Карта системы</span>
    </button>
    <button class="tabbar-btn" id="systemLore">
      <span class="tabbar-btn-icon" aria-hidden="true">👑</span><span class="tabbar-btn-label">Контролирующая раса</span>
    </button>
  </div>
  <div id="systemContainer" style="position:absolute; inset:0; touch-action:none;"></div>
</div>

<!-- Окно-вкладыш "Корабль-город Феном" — открывается поверх карты галактики,
     сама карта карта остаётся видна (затемнена) по краям. Внутри — карта Феном
     (тайлы + OpenSeadragon, см. js/phenom.js). -->
<div class="phenom-overlay" id="phenomOverlay">
  <div class="phenom-card" id="phenomCard">
    <div class="phenom-toolbar lore-toolbar">
      <button class="toolbar-close-btn" id="phenomClose" aria-label="Закрыть">✕</button>
      <button class="phenom-desc" data-ref="phenom">Описание Фенома</button>
    </div>
    <div class="phenom-content" id="phenomContent">
      <div class="phenom-viewer" id="phenomViewer"></div>
    </div>
  </div>
</div>

<!-- Окно-вкладыш сюжетного маркера — тот же слой, что и "Феном" (карта под
     ним видна, затемнена по краям), но содержимое текстовое, а не карта на
     тайлах. Данные — из stories.json, см. js/stories.js. -->
<div class="phenom-overlay story-overlay" id="storyOverlay">
  <div class="phenom-card" id="storyCard">
    <div class="phenom-toolbar lore-toolbar">
      <button class="toolbar-close-btn" id="storyClose" aria-label="Закрыть">✕</button>
      <button class="story-action-btn" id="storyArchive">Архив постов сюжета</button>
      <button class="story-action-btn" id="storyTelegram">Раздел сюжетов в Telegram</button>
    </div>
    <div class="phenom-content story-content" id="storyContent"></div>
  </div>
</div>

<script type="module" src="js/main.js?v=15"></script>
</body>
</html>
