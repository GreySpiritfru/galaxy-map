<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Феном — корабль слоями</title>
<style>
:root { --accent:#AFEEEE; --text:#e8e8ef; --muted:rgba(255,255,255,.62); --line:rgba(255,255,255,.14);
        --safe-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin:0; height:100%; background:#06070b; color:var(--text); font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; }
#stage { position:fixed; inset:0; touch-action:none; }
#stage canvas { display:block; }

/* Панель частей корабля — как нижняя панель карты (css/styles.css: .map-dock, .dock-bar, .dock-modes, .dock-item,
   .dock-label, .view-lens; вкладки окон .tabbar-btn). Одна капсула: части + инструмент правки ✎ справа.
   Высота и поле снизу — переменные: от них же стоят карточка района и полоса правки (над панелью, зазор 8). */
:root { --dock-b:10px; --dock-h:68px; --dock-side:5px; }
.dock { position:fixed; left:calc(var(--dock-side) + env(safe-area-inset-left, 0px)); right:calc(var(--dock-side) + env(safe-area-inset-right, 0px));
        bottom:calc(var(--dock-b) + var(--safe-bottom)); z-index:10; display:flex;
        pointer-events:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
.dock-bar { flex:1 1 auto; min-width:0; display:flex; align-items:center; height:var(--dock-h); box-sizing:border-box; border-radius:20px;
            background:rgba(16,16,24,.86); box-shadow:0 8px 26px rgba(0,0,0,.45); pointer-events:auto; }
.dock button { margin:0; border:0; font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.dock button:focus { outline:none; }
.dock button:focus-visible { outline:2px solid rgba(175,238,238,.7); outline-offset:2px; }
.modes { position:relative; flex:1 1 auto; min-width:0; display:flex; height:var(--dock-h); padding:4px; box-sizing:border-box; }
.modes button { position:relative; z-index:1; flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
                padding:0 2px; border-radius:16px; background:none; color:#ececf2; transition:color .18s ease; }
.modes button.active { color:var(--accent); }
.dock-svg { display:block; overflow:visible; width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.dock-label { font-size:11px; font-weight:600; line-height:14px; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.lens { position:absolute; top:4px; bottom:4px; left:0; width:0; border-radius:16px; background:rgba(175,238,238,.15);
        box-shadow:inset 0 0 0 1px rgba(175,238,238,.3); pointer-events:none; }
.lens.ready { transition:transform .34s cubic-bezier(.2,.9,.25,1), width .34s cubic-bezier(.2,.9,.25,1); }
/* ✎ — инструмент панели (как 🔍 у карты, .dock-tool): цель 48 × 60, без подписи. Включена правка — бирюзовый
   и подложка линзы (это «текущее»). */
.dock-tool { flex:0 0 auto; width:48px; height:60px; margin-right:4px; padding:0; display:flex; align-items:center; justify-content:center;
             border-radius:16px; background:none; color:#ececf2; transition:color .18s ease; }
.dock-tool.active { color:var(--accent); background:rgba(175,238,238,.15); box-shadow:inset 0 0 0 1px rgba(175,238,238,.3); }
@media (hover:hover) { .dock button:hover { color:#fff; } .dock button.active:hover { color:var(--accent); } }
@media (prefers-reduced-motion:reduce) { .lens.ready, .modes button, .dock-tool { transition:none; } }
/* Шире телефона — панель по центру, части своей ширины. */
@media (min-width:601px) {
  .dock { left:50%; right:auto; transform:translateX(-50%); }
  .modes { flex:0 0 auto; }
  .modes button { flex:0 0 auto; width:72px; }
}
/* Компьютер: одна строка, подпись 14 px справа от значка. */
@media (min-width:1000px) {
  :root { --dock-b:16px; --dock-h:64px; }
  .dock-bar { border-radius:18px; }
  .modes button { flex-direction:row; gap:9px; width:auto; padding:0 16px; }
  .dock-label { font-size:14px; line-height:18px; letter-spacing:0; }
  .lens, .dock-tool { border-radius:14px; }
  .dock-tool { height:52px; margin-right:6px; }
}
/* Полоса правки — над панелью; кнопки — прямоугольник 8, без обводки, белый текст, цель 48. */
#editBar { position:fixed; left:calc(var(--dock-side) + env(safe-area-inset-left, 0px)); right:calc(var(--dock-side) + env(safe-area-inset-right, 0px));
           bottom:calc(var(--dock-b) + var(--dock-h) + 8px + var(--safe-bottom)); z-index:11; max-width:560px; margin:0 auto; box-sizing:border-box;
           display:flex; gap:4px; align-items:center; padding:4px 4px 4px 16px; border-radius:16px; background:rgba(16,16,24,.95);
           box-shadow:0 8px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
#editBar[hidden] { display:none; }
#editHint { flex:1 1 auto; min-width:0; font-size:13px; color:var(--muted); }
#editBar button { flex:0 0 auto; min-height:48px; padding:0 12px; font:inherit; font-size:14px; font-weight:600; color:#fff;
                  background:rgba(255,255,255,.08); border:0; border-radius:8px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
@media (hover:hover) { #editBar button:hover { background:rgba(255,255,255,.14); } }

#fps { position:fixed; right:8px; top:8px; z-index:5; font:11px/1.3 ui-monospace, monospace; color:var(--muted); background:rgba(10,10,16,.7);
       padding:3px 6px; border-radius:7px; text-align:right; pointer-events:none; }
#card { position:fixed; left:calc(var(--dock-side) + env(safe-area-inset-left, 0px)); right:calc(var(--dock-side) + env(safe-area-inset-right, 0px));
        bottom:calc(var(--dock-b) + var(--dock-h) + 8px + var(--safe-bottom)); z-index:11; max-width:560px; margin:0 auto; box-sizing:border-box;
        background:rgba(16,16,24,.95); box-shadow:0 8px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); border-radius:16px; padding:12px 48px 12px 16px; display:none; }
#card.open { display:block; }
body.picking canvas { cursor:crosshair; }
#card h2 { margin:0 0 2px; font-size:17px; font-weight:600; }
#card .sub { color:var(--muted); font-size:13px; }
#card p { margin:6px 0 0; font-size:14px; }
#card { max-height:62vh; overflow-y:auto; }
#card .imgs { display:flex; gap:6px; overflow-x:auto; margin:8px 0 2px; scrollbar-width:thin; }
#card .imgs img { height:130px; max-width:100%; border-radius:10px; flex:0 0 auto; object-fit:cover; background:#0c1116; }
#card .imgs img:only-child { width:100%; height:auto; max-height:200px; }
#card .chips span { display:inline-block; padding:2px 8px; margin:5px 5px 0 0; border-radius:8px; background:rgba(175,238,238,.1); color:var(--accent); font-size:13px; }
/* ✕ — цель 48 × 48 в углу карточки, значок из того же линейного набора. */
#card .x { position:absolute; right:0; top:0; width:48px; height:48px; padding:0; display:flex; align-items:center; justify-content:center;
           background:none; border:0; border-radius:8px; color:#ececf2; cursor:pointer; -webkit-tap-highlight-color:transparent; }
#card .x svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; }
#card .x:focus { outline:none; }
#card .x:focus-visible { outline:2px solid rgba(175,238,238,.7); outline-offset:-4px; }
@media (hover:hover) { #card .x:hover { color:#fff; background:rgba(255,255,255,.08); } }
#loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); z-index:7; pointer-events:none; }
</style>
</head>
<body>
<div id="stage"></div>
<nav class="dock" id="dock" aria-label="Части корабля">
  <div class="dock-bar">
  <div class="modes" id="modes">
    <span class="lens" id="lens"></span>
    <button data-f="all" class="active" aria-label="Весь корабль">
      <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12l4.5-4H18l3.5 2.5v3L18 16H6.5z"/><ellipse cx="15" cy="12" rx="1.6" ry="6.5"/></svg>
      <span class="dock-label">Корабль</span></button>
    <button data-f="nose" aria-label="Передняя оболочка">
      <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12L11 5.5h10.5v13H11z"/><path d="M14 9.5h4M14 14.5h4"/></svg>
      <span class="dock-label">Нос</span></button>
    <button data-f="city" aria-label="Феном-Сити">
      <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20v-8h4v8M10 20V5h4v15M15 20v-6h4v6"/></svg>
      <span class="dock-label">Город</span></button>
    <button data-f="rings" aria-label="Кольца">
      <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="12" rx="3.2" ry="8.5"/><ellipse cx="15.5" cy="12" rx="3.2" ry="8.5"/><path d="M2 12h20"/></svg>
      <span class="dock-label">Кольца</span></button>
    <button data-f="stern" aria-label="Корма и двигатель">
      <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h8l2-2.5v11L11 15H3zM13 9.5l4-2v9l-4-2"/><path d="M19.5 9.5l2-.8M19.5 14.5l2 .8M19.5 12h2.5"/></svg>
      <span class="dock-label">Корма</span></button>
  </div>
  <button class="dock-tool" id="editBtn" aria-label="Править разметку районов" title="Править разметку районов">
    <svg class="dock-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></button>
  </div>
</nav>
<div id="editBar" hidden><span id="editHint">Тяни точки углов районов</span><button id="copyZones">Скопировать</button><button id="resetZones">Сброс</button></div>
<div id="card" role="dialog" aria-live="polite"><button class="x" id="cardClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="cardBody"></div></div>
<div id="fps"></div>
<div id="loading">Загрузка…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.19.0/pixi.min.js"></script>
<script src="ship.js?v=108"></script>
</body>
</html>
